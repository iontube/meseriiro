name: Deploy to Cloudflare Pages

# ⛔ Doar manual. Deploy-ul real se face de pe server (wrangler, direct-upload), cu datele
# generate acolo. Un push nu are voie sa redeployeze site-ul din ce e in repo.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Generate drip sitemap index
        run: node scripts/drip-sitemap-index.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name meseriiro --branch main
